name: Release Scheme 3 package

on:
  push:
    branches:
      - 'pqsa-scheme3'
    tags:
      - 'pq-stealth-scheme3-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          build-packages: false

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./crates/pq-stealth-ts/package.json').version")
          test "${GITHUB_REF_NAME}" = "pq-stealth-scheme3-v${version}"

      - name: Build package
        run: pnpm --filter @kohaku-eth/pq-stealth-scheme3 build

      - name: Pack package
        run: |
          mkdir release
          pnpm --filter @kohaku-eth/pq-stealth-scheme3 \
            pack --pack-destination "${GITHUB_WORKSPACE}/release"
          cd release
          sha256sum *.tgz > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pq-stealth-scheme3-${{ github.sha }}
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tgz release/SHA256SUMS \
            --generate-notes \
            --title "Scheme 3 ${GITHUB_REF_NAME#pq-stealth-scheme3-v}"
